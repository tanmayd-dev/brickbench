[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "brickbench"
version = "0.1.0"
description = "LLM Android debloat evaluation framework"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jinja2>=3.1.0",
    "python-httpx>=0.27.0",
    "python-pydantic>=2.8.0",
    "python-rich>=13.0",
    "python-yaml>=6.0",
    "python-pillow>=10.0",
    "python-matplotlib>=3.8.0",
    "python-pandas>=2.2.0",
    "sqliteutils>=2.8.0",
    "pygments>=2.18.0",
]

[project.scripts]
brickbench = "brickbench.cli:main"

[tool.setuptools.packages.find]
where = ["brickbench"]