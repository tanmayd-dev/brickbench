[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brickbench"
version = "0.1.0"
description = "LLM Android debloat evaluation framework"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]

[project.scripts]
brickbench = "brickbench.cli:cli"

[tool.setuptools.packages.find]
where = ["."]